name: Deploy Plotly graphs to Pages

on:
  push:
    branches:
      - main
    paths:
      - "EnergeticSpanModel/rNets_diagram/plotly/**"
      - ".github/workflows/deploy-plotly-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Plotly files only
        uses: actions/checkout@v7
        with:
          sparse-checkout: EnergeticSpanModel/rNets_diagram/plotly
          submodules: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Plotly site
        uses: actions/upload-pages-artifact@v5
        with:
          path: EnergeticSpanModel/rNets_diagram/plotly

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
