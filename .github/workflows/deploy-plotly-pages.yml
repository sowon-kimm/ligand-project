name: Deploy all HTML files to Pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - ".github/workflows/deploy-plotly-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout all HTML files only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            *.html
          sparse-checkout-cone-mode: false
          submodules: false
          fetch-depth: 1

      - name: Prepare site
        run: |
          mkdir -p _site

          # 모든 HTML 파일을 원래 directory 구조 그대로 복사
          find . \
            -type f \
            -name "*.html" \
            -not -path "./_site/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            mkdir -p "_site/$(dirname "$rel")"
            cp "$file" "_site/$rel"
          done

          # 모든 HTML 파일을 자동으로 보여주는 index 생성
          {
            echo '<!DOCTYPE html>'
            echo '<html>'
            echo '<head>'
            echo '<meta charset="UTF-8">'
            echo '<title>Ligand Project - HTML Files</title>'
            echo '</head>'
            echo '<body>'
            echo '<h1>Ligand Project - HTML Files</h1>'
            echo '<ul>'

            find _site \
              -type f \
              -name "*.html" \
              ! -name "index.html" \
              | sort \
              | while read file; do
                  rel="${file#_site/}"
                  echo "<li><a href=\"$rel\">$rel</a></li>"
                done

            echo '</ul>'
            echo '</body>'
            echo '</html>'
          } > _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
