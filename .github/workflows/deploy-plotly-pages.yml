name: Deploy Plotly graphs to Pages

on:
  push:
    branches:
      - main
    paths:
      - "figures_corrected/html_files/**"
      - ".github/workflows/deploy-plotly-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout HTML files only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            figures_corrected/html_files
          sparse-checkout-cone-mode: false
          submodules: false
          fetch-depth: 1

      - name: Prepare site
        run: |
          mkdir -p _site
          cp figures_corrected/html_files/*.html _site/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Ligand Project - Plotly Figures</title>
          </head>
          <body>
            <h1>Ligand Project - Interactive Plotly Figures</h1>

            <ul>
              <li><a href="all_capping_minimum_path_001_corrected.html">All capping minimum path - 001</a></li>
              <li><a href="all_capping_minimum_path_011_corrected.html">All capping minimum path - 011</a></li>

              <li><a href="all_paths_001_corrected_barrier1p0.html">All paths - 001</a></li>
              <li><a href="all_paths_011_corrected_barrier1p0.html">All paths - 011</a></li>

              <li><a href="capped_start_path_001_corrected.html">Capped start path - 001</a></li>
              <li><a href="capped_start_path_011_corrected.html">Capped start path - 011</a></li>

              <li><a href="capping_001_corrected.html">Capping - 001 corrected</a></li>
              <li><a href="capping_001_uncorrected.html">Capping - 001 uncorrected</a></li>

              <li><a href="capping_011_corrected.html">Capping - 011 corrected</a></li>
              <li><a href="capping_011_uncorrected.html">Capping - 011 uncorrected</a></li>

              <li><a href="pure_001_corrected.html">Pure - 001</a></li>
              <li><a href="pure_011_corrected.html">Pure - 011</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
